[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "distribuidora-damian"
version = "0.1.0"
description = "Aplicacion local de gestion para Distribuidora Damian."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "SQLAlchemy>=2.0,<3",
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "pypdf>=4.3,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]
packaging = [
    "pyinstaller>=6.9,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
